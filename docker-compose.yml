# Everything free & local:  docker compose up --build        -> http://localhost:8000
# With a local AI model in a container (CPU):  docker compose --profile ollama up --build
# (If you already run Ollama on your computer, skip the profile: the app reaches it via host.docker.internal.)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot-local-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot"]
      interval: 5s
      retries: 10
    # Not published to the host: only the app container can reach it.

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env (see .env.example)}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      SECURE_SSL_REDIRECT: "false" # plain http on your own machine only
      DATABASE_URL: postgres://jobpilot:${POSTGRES_PASSWORD:-jobpilot-local-only}@db:5432/jobpilot
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      JOB_SOURCES_ENABLED: ${JOB_SOURCES_ENABLED:-true}
      BILLING_ENABLED: "false"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [media:/app/backend/media]

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    # After first start:  docker compose exec ollama ollama pull llama3.2:3b
    # then set OLLAMA_BASE_URL=http://ollama:11434 in .env

volumes: { pgdata: {}, media: {}, ollama: {} }
